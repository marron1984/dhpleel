<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reels | 北新地 大嵓埜 2月新メニュー</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

        :root {
            --gold: #C4A265;
            --gold-light: #E8D5A8;
            --dark: #0A0A0A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            font-family: 'Noto Sans JP', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .page-title {
            font-family: 'Noto Serif JP', serif;
            font-weight: 300;
            font-size: 14px;
            letter-spacing: 4px;
            color: var(--gold);
            margin-bottom: 20px;
            text-align: center;
        }

        /* Phone Frame */
        .phone-wrapper {
            position: relative;
            width: 360px;
            height: 640px;
            border-radius: 40px;
            background: #000;
            box-shadow: 0 0 0 3px #333, 0 0 0 6px #1a1a1a, 0 20px 60px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 24px;
            background: #000;
            border-radius: 0 0 16px 16px;
            z-index: 100;
        }

        /* Reels Container */
        .reels-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #000;
            border-radius: 37px;
        }

        /* Scene (each slide) */
        .scene {
            position: absolute;
            inset: 0;
            opacity: 0;
            z-index: 1;
            transition: opacity 0.6s ease;
        }

        .scene.active {
            opacity: 1;
            z-index: 10;
        }

        .scene.exiting {
            opacity: 0;
            z-index: 5;
        }

        /* Scene Image */
        .scene-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            will-change: transform;
        }

        /* Ken Burns Animations */
        .scene.active .kb-zoom-in {
            animation: kbZoomIn 2.5s ease-out forwards;
        }
        .scene.active .kb-zoom-out {
            animation: kbZoomOut 2.5s ease-out forwards;
        }
        .scene.active .kb-pan-right {
            animation: kbPanRight 2.5s ease-out forwards;
        }
        .scene.active .kb-pan-left {
            animation: kbPanLeft 2.5s ease-out forwards;
        }
        .scene.active .kb-zoom-tilt {
            animation: kbZoomTilt 2.5s ease-out forwards;
        }

        @keyframes kbZoomIn {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }
        @keyframes kbZoomOut {
            from { transform: scale(1.2); }
            to { transform: scale(1); }
        }
        @keyframes kbPanRight {
            from { transform: scale(1.15) translateX(-3%); }
            to { transform: scale(1.15) translateX(3%); }
        }
        @keyframes kbPanLeft {
            from { transform: scale(1.15) translateX(3%); }
            to { transform: scale(1.15) translateX(-3%); }
        }
        @keyframes kbZoomTilt {
            from { transform: scale(1) rotate(0deg); }
            to { transform: scale(1.12) rotate(0.5deg); }
        }

        /* Dark overlay gradient */
        .scene-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.3) 0%,
                transparent 25%,
                transparent 50%,
                rgba(0,0,0,0.5) 75%,
                rgba(0,0,0,0.8) 100%
            );
            z-index: 2;
        }

        /* Shimmer / sparkle effect for intro */
        .shimmer-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(255,215,140,0.15) 0%, transparent 60%);
            z-index: 3;
            opacity: 0;
        }

        .scene.active .shimmer-overlay {
            animation: shimmer 2s ease-in-out;
        }

        @keyframes shimmer {
            0% { opacity: 0; }
            30% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* Steam effect */
        .steam-overlay {
            position: absolute;
            top: 20%;
            left: 30%;
            width: 40%;
            height: 40%;
            z-index: 3;
            opacity: 0;
            pointer-events: none;
        }

        .steam-overlay::before,
        .steam-overlay::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(8px);
        }

        .scene.active .steam-overlay {
            animation: steamFloat 2.5s ease-in-out forwards;
        }

        .scene.active .steam-overlay::before {
            animation: steamRise1 2.5s ease-out forwards;
        }

        .scene.active .steam-overlay::after {
            animation: steamRise2 2.5s ease-out 0.3s forwards;
        }

        @keyframes steamFloat {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        @keyframes steamRise1 {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }

        @keyframes steamRise2 {
            0% { transform: translateX(20px) translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateX(30px) translateY(-100px) scale(1.8); opacity: 0; }
        }

        /* Text overlays */
        .scene-text {
            position: absolute;
            z-index: 20;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0,0,0,0.7);
        }

        .text-top {
            top: 50px;
            left: 20px;
            right: 20px;
            text-align: center;
        }

        .text-center {
            top: 50%;
            left: 20px;
            right: 20px;
            transform: translateY(-50%);
            text-align: center;
        }

        .text-bottom {
            bottom: 100px;
            left: 20px;
            right: 20px;
            text-align: center;
        }

        .text-bottom-left {
            bottom: 100px;
            left: 20px;
            right: 80px;
            text-align: left;
        }

        /* Text animations */
        .scene-text .line {
            opacity: 0;
            transform: translateY(12px);
            display: block;
        }

        .scene.active .scene-text .line {
            animation: textFadeUp 0.7s ease forwards;
        }

        .scene.active .scene-text .line:nth-child(1) { animation-delay: 0.2s; }
        .scene.active .scene-text .line:nth-child(2) { animation-delay: 0.5s; }
        .scene.active .scene-text .line:nth-child(3) { animation-delay: 0.8s; }
        .scene.active .scene-text .line:nth-child(4) { animation-delay: 1.1s; }

        @keyframes textFadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title-main {
            font-family: 'Noto Serif JP', serif;
            font-weight: 300;
            font-size: 22px;
            letter-spacing: 6px;
            margin-bottom: 6px;
        }

        .title-sub {
            font-family: 'Noto Serif JP', serif;
            font-weight: 300;
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--gold-light);
        }

        .title-badge {
            display: inline-block;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 9px;
            letter-spacing: 3px;
            padding: 4px 14px;
            margin-bottom: 14px;
        }

        .dish-name {
            font-family: 'Noto Serif JP', serif;
            font-weight: 400;
            font-size: 20px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .dish-desc {
            font-family: 'Noto Serif JP', serif;
            font-weight: 300;
            font-size: 12px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.8);
            line-height: 1.8;
        }

        .copy-text {
            font-family: 'Noto Serif JP', serif;
            font-weight: 300;
            font-size: 13px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.9);
            line-height: 2;
        }

        .cta-phone {
            font-family: 'Noto Serif JP', serif;
            font-size: 24px;
            color: var(--gold);
            letter-spacing: 3px;
            margin: 8px 0;
        }

        .cta-address {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
        }

        /* Gold line decoration */
        .gold-line {
            width: 40px;
            height: 1px;
            background: var(--gold);
            margin: 10px auto;
            opacity: 0;
        }

        .scene.active .gold-line {
            animation: lineExpand 0.8s ease 0.4s forwards;
        }

        @keyframes lineExpand {
            from { width: 0; opacity: 0; }
            to { width: 40px; opacity: 1; }
        }

        /* Instagram-style UI overlay */
        .ig-ui {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
        }

        .ig-header {
            position: absolute;
            top: 32px;
            left: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ig-header .reels-label {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .ig-header .camera-icon {
            font-size: 20px;
        }

        .ig-sidebar {
            position: absolute;
            right: 12px;
            bottom: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .ig-sidebar .ig-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .ig-sidebar .ig-icon {
            font-size: 24px;
        }

        .ig-sidebar .ig-count {
            font-size: 10px;
            font-weight: 500;
        }

        .ig-bottom {
            position: absolute;
            bottom: 20px;
            left: 12px;
            right: 60px;
        }

        .ig-account {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .ig-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #000;
        }

        .ig-username {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .ig-caption {
            font-size: 11px;
            line-height: 1.5;
            color: rgba(255,255,255,0.85);
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .ig-music {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 10px;
            color: rgba(255,255,255,0.7);
        }

        .ig-music .music-icon {
            font-size: 12px;
        }

        .ig-music .music-scroll {
            overflow: hidden;
            white-space: nowrap;
        }

        /* Progress bars (Instagram-style at top) */
        .ig-progress {
            position: absolute;
            top: 26px;
            left: 8px;
            right: 8px;
            display: flex;
            gap: 3px;
            z-index: 60;
        }

        .ig-progress-seg {
            flex: 1;
            height: 2px;
            background: rgba(255,255,255,0.3);
            border-radius: 1px;
            overflow: hidden;
        }

        .ig-progress-seg .fill {
            height: 100%;
            background: #fff;
            width: 0%;
            border-radius: 1px;
        }

        .ig-progress-seg.done .fill {
            width: 100%;
        }

        .ig-progress-seg.current .fill {
            animation: progressFill var(--scene-duration) linear forwards;
        }

        @keyframes progressFill {
            from { width: 0%; }
            to { width: 100%; }
        }

        /* Play / Pause overlay */
        .play-overlay {
            position: absolute;
            inset: 0;
            z-index: 70;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .play-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .play-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform 0.2s;
        }

        .play-circle:hover {
            transform: scale(1.1);
        }

        /* Tap to pause area */
        .tap-area {
            position: absolute;
            inset: 0;
            z-index: 55;
            cursor: pointer;
        }

        /* Controls below phone */
        .controls {
            margin-top: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 13px;
            font-family: 'Noto Sans JP', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .ctrl-btn:hover {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .ctrl-btn.primary {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .ctrl-btn.primary:hover {
            background: var(--gold-light);
        }

        .scene-indicator {
            font-family: 'Noto Serif JP', serif;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            margin-top: 16px;
        }

        /* Lid open effect for rice scene */
        .lid-effect {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 3;
            opacity: 0;
        }

        .scene.active .lid-effect {
            animation: lidOpen 1s ease-out forwards;
        }

        @keyframes lidOpen {
            0% { opacity: 1; }
            30% { opacity: 0.7; }
            100% { opacity: 0; }
        }

        /* Quick cut effect */
        .flash-effect {
            position: absolute;
            inset: 0;
            background: #fff;
            z-index: 3;
            opacity: 0;
            pointer-events: none;
        }

        .scene.active .flash-effect {
            animation: flashCut 0.15s ease 1s;
        }

        @keyframes flashCut {
            0% { opacity: 0; }
            50% { opacity: 0.4; }
            100% { opacity: 0; }
        }

        /* End CTA pulse */
        .cta-pulse {
            display: inline-block;
            padding: 10px 28px;
            border: 1px solid var(--gold);
            border-radius: 28px;
            font-family: 'Noto Serif JP', serif;
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--gold);
            opacity: 0;
        }

        .scene.active .cta-pulse {
            animation: ctaPulseIn 0.6s ease 0.6s forwards, ctaGlow 1.5s ease 1.2s infinite;
        }

        @keyframes ctaPulseIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes ctaGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(196,162,101,0.2); }
            50% { box-shadow: 0 0 24px rgba(196,162,101,0.5); }
        }

        /* Responsive */
        @media (max-width: 400px) {
            .phone-wrapper {
                width: 320px;
                height: 568px;
                border-radius: 32px;
            }
            .reels-container {
                border-radius: 30px;
            }
        }

        /* Export hint */
        .export-hint {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            text-align: center;
            letter-spacing: 1px;
            max-width: 360px;
            line-height: 1.8;
        }
    </style>
</head>

                kb: 'kb-zoom-tilt',
                hasSteam: true,
                textPosition: 'text-bottom-left',
                lines: [
                    { class: 'dish-name', text: '清  湯' },
                    { class: 'dish-desc', text: '優雅なフィナーレ' }
                ]
            },
            {
                // 9: Rice (lid open)
                image: 'https://github.com/user-attachments/assets/ee7a5a4a-885d-4f95-b83c-5ee014652a4c',
                duration: 2200,
                kb: 'kb-zoom-in',
                hasLid: true,
                hasSteam: true,
                textPosition: 'text-bottom-left',
                lines: [
                    { class: 'dish-name', text: 'ご  飯' },
                    { class: 'dish-desc', text: 'えびと緑のハーモニー' }
                ]
            },
            {
                // 10: Dessert
                image: 'https://github.com/user-attachments/assets/b39bf119-c360-47df-b8b1-5399b4445ab1',
                duration: 2200,
                kb: 'kb-zoom-out',
                textPosition: 'text-bottom-left',
                lines: [
                    { class: 'dish-name', text: 'デザート' },
                    { class: 'dish-desc', text: '苺・メロン・マンゴーの甘美' }
                ]
            },
            {
                // 11: End CTA
                image: 'https://github.com/user-attachments/assets/6e9bb9c1-0ead-47de-b875-ac9dfde0c3b7',
                duration: 3000,
                kb: 'kb-zoom-in',
                hasShimmer: true,
                textPosition: 'text-center',
                isCTA: true,
                lines: [
                    { class: 'copy-text', text: '接待・記念日に' },
                    { class: 'title-main', text: '大嵓埜' },
                    { class: 'cta-phone', text: '06-6341-3535' },
                    { class: 'cta-address', text: '北新地 FOODEAR ビル 3F' }
                ]
            }
        ];

        let currentScene = -1;
        let isPlaying = false;
        let sceneTimeout = null;

        function buildScenes() {
            const wrapper = document.getElementById('scenesWrapper');
            const progress = document.getElementById('igProgress');
            wrapper.innerHTML = '';
            progress.innerHTML = '';

            SCENES.forEach((s, i) => {
                // Scene element
                const div = document.createElement('div');
                div.className = 'scene';
                div.id = `scene-${i}`;
                div.innerHTML = `
                    <div class="scene-image ${s.kb}" style="background-image:url('${s.image}')"></div>
                    <div class="scene-overlay"></div>
                    ${s.hasShimmer ? '<div class="shimmer-overlay"></div>' : ''}
                    ${s.hasSteam ? '<div class="steam-overlay"></div>' : ''}
                    ${s.hasLid ? '<div class="lid-effect"></div>' : ''}
                    ${s.hasFlash ? '<div class="flash-effect"></div>' : ''}
                    <div class="scene-text ${s.textPosition}">
                        ${s.lines.map(l => {
                            if (s.isCTA && l.class === 'cta-phone') {
                                return `<span class="line cta-pulse">${l.text}</span>`;
                            }
                            return `<span class="line ${l.class}">${l.text}</span>`;
                        }).join('')}
                        ${!s.isHook && !s.isCTA ? '<div class="line gold-line"></div>' : ''}
                    </div>
                `;
                wrapper.appendChild(div);

                // Progress segment (skip the hook intro for cleaner progress)
                if (!s.isHook) {
                    const seg = document.createElement('div');
                    seg.className = 'ig-progress-seg';
                    seg.id = `prog-${i}`;
                    seg.innerHTML = '<div class="fill"></div>';
                    progress.appendChild(seg);
                }
            });
        }

        function showScene(index) {
            if (index >= SCENES.length) {
                isPlaying = false;
                document.getElementById('btnPlay').innerHTML = '&#9654; 再生';
                return;
            }

            // Hide previous
            if (currentScene >= 0) {
                const prev = document.getElementById(`scene-${currentScene}`);
                if (prev) {
                    prev.classList.remove('active');
                    prev.classList.add('exiting');
                    setTimeout(() => prev.classList.remove('exiting'), 600);
                }
            }

            currentScene = index;
            const scene = SCENES[index];

            // Show current
            const el = document.getElementById(`scene-${index}`);
            // Reset animations by re-inserting
            el.classList.remove('active');
            void el.offsetWidth;
            el.classList.add('active');

            // Update progress bars
            SCENES.forEach((s, i) => {
                if (s.isHook) return;
                const seg = document.getElementById(`prog-${i}`);
                if (!seg) return;
                seg.classList.remove('done', 'current');
                seg.style.setProperty('--scene-duration', s.duration + 'ms');
                if (i < index) {
                    seg.classList.add('done');
                } else if (i === index) {
                    seg.classList.add('current');
                }
            });

            // Update indicator
            const displayNum = scene.isHook ? 1 : Math.min(index, 11);
            document.getElementById('sceneIndicator').textContent =
                `SCENE ${String(displayNum).padStart(2,'0')} / ${SCENES.length - 1}`;

            // Next scene
            sceneTimeout = setTimeout(() => {
                if (isPlaying) showScene(index + 1);
            }, scene.duration);
        }

        function startReels() {
            if (isPlaying) {
                pauseReels();
                return;
            }
            isPlaying = true;
            document.getElementById('playOverlay').classList.add('hidden');
            document.getElementById('btnPlay').innerHTML = '&#9646;&#9646; 一時停止';

            if (currentScene < 0 || currentScene >= SCENES.length - 1) {
                showScene(0);
            } else {
                showScene(currentScene);
            }
        }

        function pauseReels() {
            isPlaying = false;
            clearTimeout(sceneTimeout);
            document.getElementById('btnPlay').innerHTML = '&#9654; 再生';
        }

        function restartReels() {
            clearTimeout(sceneTimeout);
            currentScene = -1;
            isPlaying = false;

            // Reset all scenes
            document.querySelectorAll('.scene').forEach(s => {
                s.classList.remove('active', 'exiting');
            });
            document.querySelectorAll('.ig-progress-seg').forEach(s => {
                s.classList.remove('done', 'current');
            });

            document.getElementById('playOverlay').classList.remove('hidden');
            document.getElementById('btnPlay').innerHTML = '&#9654; 再生';
            document.getElementById('sceneIndicator').textContent = 'SCENE 01 / 10';
        }

        // Tap to play/pause
        document.getElementById('playOverlay').addEventListener('click', startReels);
        document.getElementById('tapArea').addEventListener('click', () => {
            if (isPlaying) {
                pauseReels();
            } else {
                startReels();
            }
        });

        // Init
        buildScenes();
    </script>
</body>
</html>
