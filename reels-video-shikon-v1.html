<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Reels | 禅園 紫紺コース</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap');

        :root {
            --gold: #C4A265;
            --gold-dim: #8B7340;
            --gold-light: #E8D5A8;
            --dark: #0A0A0A;
            --warm: #1A1410;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            font-family: 'Noto Serif JP', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }

        .page-title {
            font-weight: 300;
            font-size: 13px;
            letter-spacing: 4px;
            color: var(--gold-dim);
            margin-bottom: 20px;
            text-align: center;
        }

        /* Phone Frame */
        .phone-wrapper {
            position: relative;
            width: 360px;
            height: 640px;
            border-radius: 40px;
            background: #000;
            box-shadow: 0 0 0 3px #222, 0 0 0 6px #111, 0 30px 80px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 24px;
            background: #000;
            border-radius: 0 0 16px 16px;
            z-index: 100;
        }

        .reels-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #000;
            border-radius: 37px;
        }

        /* ========================================= */
        /* SCENE SYSTEM                              */
        /* ========================================= */
        .scene {
            position: absolute;
            inset: 0;
            opacity: 0;
            z-index: 1;
        }

        .scene.active {
            opacity: 1;
            z-index: 10;
            animation: sceneFadeIn 0.8s ease forwards;
        }

        .scene.exiting {
            z-index: 5;
            animation: sceneFadeOut 0.8s ease forwards;
        }

        @keyframes sceneFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes sceneFadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Image layer */
        .scene-image {
            position: absolute;
            inset: -40px;
            background-size: cover;
            background-position: center;
            will-change: transform;
            filter: brightness(0.85) contrast(1.05) saturate(1.1);
        }

        /* Slow Ken Burns */
        .scene.active .kb-slow-in {
            animation: kbSlowIn 5s ease-out forwards;
        }
        .scene.active .kb-slow-out {
            animation: kbSlowOut 5s ease-out forwards;
        }
        .scene.active .kb-drift-right {
            animation: kbDriftRight 5s ease-out forwards;
        }
        .scene.active .kb-drift-left {
            animation: kbDriftLeft 5s ease-out forwards;
        }
        .scene.active .kb-tilt {
            animation: kbTilt 5s ease-out forwards;
        }

        @keyframes kbSlowIn {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }
        @keyframes kbSlowOut {
            from { transform: scale(1.1); }
            to { transform: scale(1); }
        }
        @keyframes kbDriftRight {
            from { transform: scale(1.08) translateX(-1.5%); }
            to { transform: scale(1.08) translateX(1.5%); }
        }
        @keyframes kbDriftLeft {
            from { transform: scale(1.08) translateX(1.5%); }
            to { transform: scale(1.08) translateX(-1.5%); }
        }
        @keyframes kbTilt {
            from { transform: scale(1.02) rotate(-0.3deg); }
            to { transform: scale(1.08) rotate(0.3deg); }
        }

        /* ========================================= */
        /* OVERLAYS                                  */
        /* ========================================= */

        /* Cinematic vignette */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
            z-index: 3;
        }

        /* Bottom gradient for text readability */
        .bottom-grad {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.2) 0%,
                transparent 12%,
                transparent 35%,
                rgba(0,0,0,0.45) 55%,
                rgba(0,0,0,0.8) 72%,
                rgba(0,0,0,0.95) 100%
            );
            z-index: 4;
        }

        /* Film grain */
        .grain {
            position: absolute;
            inset: 0;
            z-index: 5;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Letterbox bars */
        .letterbox-top, .letterbox-bottom {
            position: absolute;
            left: 0;
            right: 0;
            background: #000;
            z-index: 6;
            height: 0;
        }
        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }

        .scene.active .letterbox-top,
        .scene.active .letterbox-bottom {
            animation: letterboxIn 1s ease 0.3s forwards;
        }

        @keyframes letterboxIn {
            to { height: 28px; }
        }

        /* Gold accent line */
        .gold-accent {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            z-index: 7;
        }

        .scene.active .gold-accent {
            animation: goldLine 1.2s ease 0.5s forwards;
        }

        @keyframes goldLine {
            to { width: 200px; }
        }

        /* ========================================= */
        /* TYPOGRAPHY                                */
        /* ========================================= */
        .scene-text {
            position: absolute;
            z-index: 20;
            color: #fff;
        }

        .text-center {
            top: 50%;
            left: 24px;
            right: 24px;
            transform: translateY(-50%);
            text-align: center;
        }

        .text-bottom {
            bottom: 56px;
            left: 28px;
            right: 28px;
            text-align: left;
        }

        /* Line animations */
        .scene-text .line {
            opacity: 0;
            display: block;
        }

        .scene.active .scene-text .line {
            animation: textFadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .scene.active .scene-text .line:nth-child(1) { animation-delay: 0.3s; }
        .scene.active .scene-text .line:nth-child(2) { animation-delay: 0.6s; }
        .scene.active .scene-text .line:nth-child(3) { animation-delay: 0.9s; }
        .scene.active .scene-text .line:nth-child(4) { animation-delay: 1.2s; }
        .scene.active .scene-text .line:nth-child(5) { animation-delay: 1.5s; }
        .scene.active .scene-text .line:nth-child(6) { animation-delay: 1.8s; }

        @keyframes textFadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Elegant fade (no movement) */
        .scene.active .scene-text .line.anim-fade {
            animation: textFadeOnly 1s ease forwards;
        }

        @keyframes textFadeOnly {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Text styles */
        .t-restaurant {
            font-weight: 600;
            font-size: 28px;
            letter-spacing: 10px;
            text-shadow: 0 2px 6px rgba(0,0,0,1), 0 4px 24px rgba(0,0,0,0.9), 0 0 50px rgba(0,0,0,0.5);
        }

        .t-subtitle {
            font-weight: 300;
            font-size: 12px;
            letter-spacing: 5px;
            color: var(--gold-light);
            margin-top: 6px;
            text-shadow: 0 1px 4px rgba(0,0,0,1), 0 2px 12px rgba(0,0,0,0.8);
        }

        .t-michelin {
            display: inline-block;
            border: 1px solid var(--gold-dim);
            color: var(--gold);
            font-family: 'Noto Serif JP', serif;
            font-weight: 400;
            font-size: 10px;
            letter-spacing: 2px;
            padding: 4px 14px;
            margin-bottom: 16px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }

        .t-course {
            font-weight: 400;
            font-size: 15px;
            letter-spacing: 8px;
            color: var(--gold);
            margin-top: 14px;
            text-shadow: 0 1px 4px rgba(0,0,0,1), 0 2px 16px rgba(0,0,0,0.9);
        }

        .t-course-en {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-style: italic;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--gold-dim);
            margin-top: 4px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 2px 12px rgba(0,0,0,0.8);
        }

        .t-num {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 48px;
            letter-spacing: 2px;
            color: var(--gold);
            line-height: 1;
            opacity: 0.6;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.7);
        }

        .t-dish-jp {
            font-weight: 600;
            font-size: 22px;
            letter-spacing: 6px;
            margin-top: 4px;
            text-shadow: 0 1px 4px rgba(0,0,0,1), 0 2px 16px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6);
        }

        .t-dish-desc {
            font-weight: 300;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.85);
            line-height: 1.8;
            margin-top: 8px;
            text-shadow: 0 1px 3px rgba(0,0,0,1), 0 2px 12px rgba(0,0,0,0.9);
        }

        .t-gold-rule {
            width: 30px;
            height: 1px;
            background: var(--gold);
            margin-top: 10px;
            opacity: 0;
        }

        .scene.active .t-gold-rule {
            animation: ruleExpand 0.8s ease 0.8s forwards;
        }

        @keyframes ruleExpand {
            from { width: 0; opacity: 0; }
            to { width: 30px; opacity: 1; }
        }

        .text-center .t-gold-rule {
            margin: 10px auto 0;
        }

        /* CTA styles */
        .t-cta-lead {
            font-weight: 300;
            font-size: 13px;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,1), 0 2px 16px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.7);
        }

        .t-phone {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 30px;
            letter-spacing: 3px;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 2px 6px rgba(0,0,0,1), 0 4px 20px rgba(0,0,0,1), 0 0 60px rgba(0,0,0,0.8);
        }

        .t-address {
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 1px 4px rgba(0,0,0,1), 0 2px 12px rgba(0,0,0,0.9);
        }

        .t-store-block {
            font-weight: 400;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.9);
            line-height: 2;
            margin-top: 14px;
            text-shadow: 0 1px 4px rgba(0,0,0,1), 0 2px 12px rgba(0,0,0,0.9);
        }

        .t-price {
            display: inline-block;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 2px;
            color: var(--gold);
            border: 1px solid var(--gold-dim);
            padding: 6px 20px;
            margin-top: 14px;
            text-shadow: 0 1px 4px rgba(0,0,0,1), 0 2px 12px rgba(0,0,0,0.8);
            box-shadow: 0 2px 16px rgba(0,0,0,0.6);
        }

        /* Pulse glow for CTA */
        .scene.active .t-phone {
            animation: textFadeUp 0.8s ease 0.6s forwards, phonePulse 2s ease 1.5s infinite;
        }

        @keyframes phonePulse {
            0%, 100% { text-shadow: 0 0 10px rgba(196,162,101,0.2); }
            50% { text-shadow: 0 0 30px rgba(196,162,101,0.5); }
        }

        /* CTA dark scrim for text readability */
        .scene-cta .cta-scrim {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 4;
        }

        /* Opening black screen */
        .scene-opening {
            background: #000;
        }

        .scene-opening .scene-text .line {
            text-align: center;
        }

        /* ========================================= */
        /* PLAY OVERLAY                              */
        /* ========================================= */
        .play-overlay {
            position: absolute;
            inset: 0;
            z-index: 70;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            cursor: pointer;
            transition: opacity 0.5s;
        }

        .play-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .play-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1.5px solid var(--gold-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--gold);
            transition: transform 0.2s;
        }

        .play-circle:hover {
            transform: scale(1.1);
        }

        .tap-area {
            position: absolute;
            inset: 0;
            z-index: 55;
            cursor: pointer;
        }

        /* Controls */
        .controls {
            margin-top: 24px;
            display: flex;
            gap: 16px;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(196,162,101,0.2);
            color: var(--gold-dim);
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 13px;
            font-family: 'Noto Serif JP', serif;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .ctrl-btn:hover {
            background: rgba(196,162,101,0.1);
            border-color: var(--gold);
            color: var(--gold);
        }

        .ctrl-btn.primary {
            background: linear-gradient(135deg, rgba(196,162,101,0.15), rgba(196,162,101,0.08));
            border-color: var(--gold-dim);
            color: var(--gold);
        }

        .scene-indicator {
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            color: rgba(196,162,101,0.3);
            letter-spacing: 3px;
            margin-top: 16px;
        }

        /* Menu */
        .menu-preview {
            margin-top: 28px;
            max-width: 360px;
            width: 100%;
            border-top: 1px solid rgba(196,162,101,0.15);
            padding-top: 20px;
        }

        .menu-preview-title {
            font-weight: 300;
            font-size: 12px;
            letter-spacing: 4px;
            color: var(--gold-dim);
            text-align: center;
            margin-bottom: 14px;
        }

        .menu-item {
            display: flex;
            gap: 12px;
            padding: 5px 0;
            font-size: 11px;
            line-height: 1.6;
            color: rgba(255,255,255,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .menu-item-label {
            font-weight: 400;
            color: var(--gold-dim);
            min-width: 36px;
            letter-spacing: 2px;
            font-size: 10px;
        }

        .menu-item-desc {
            font-weight: 200;
        }

        .export-hint {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            text-align: center;
            letter-spacing: 1px;
            max-width: 360px;
            line-height: 1.8;
        }

        @media (max-width: 400px) {
            .phone-wrapper { width: 320px; height: 568px; border-radius: 32px; }
            .reels-container { border-radius: 30px; }
        }
    </style>
</head>
<body>

    <p class="page-title">CINEMATIC REELS ── 紫紺コース</p>

    <div class="phone-wrapper">
        <div class="phone-notch"></div>
        <div class="reels-container" id="reelsContainer">
            <div id="scenesWrapper"></div>
            <div class="tap-area" id="tapArea"></div>
            <div class="play-overlay" id="playOverlay">
                <div class="play-circle">&#9654;</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn primary" id="btnPlay" onclick="startReels()">&#9654; 再生</button>
        <button class="ctrl-btn" id="btnRestart" onclick="restartReels()">&#x21BB; 最初から</button>
    </div>
    <div class="scene-indicator" id="sceneIndicator">01 / 10</div>

    <div class="menu-preview">
        <div class="menu-preview-title">紫紺コース ── 二月の献立</div>
        <div class="menu-item"><span class="menu-item-label">前　菜</span><span class="menu-item-desc">ズワイガニ湯葉和え いなり小袖寿司 鰯梅煮 鬼面人参旨煮 海老金棒 お多福豆</span></div>
        <div class="menu-item"><span class="menu-item-label">造　里</span><span class="menu-item-desc">～鮮魚三種盛～ 鮪 鰤 平貝 造里醤油 あしらい</span></div>
        <div class="menu-item"><span class="menu-item-label">焼　物</span><span class="menu-item-desc">鰤の葱焼 蓮根 初神</span></div>
        <div class="menu-item"><span class="menu-item-label">揚　物</span><span class="menu-item-desc">河豚唐揚げ 筍コロッケ レモン 青唐</span></div>
        <div class="menu-item"><span class="menu-item-label">温　物</span><span class="menu-item-desc">石狩煮 鮭 小芋 牛蒡 白葱 三つ葉</span></div>
        <div class="menu-item"><span class="menu-item-label">仕　上</span><span class="menu-item-desc">名物明石の天然真鯛を使った鯛飯 香の物 味噌汁 生姜 胡麻</span></div>
        <div class="menu-item"><span class="menu-item-label">甘　味</span><span class="menu-item-desc">ショコラブリュレ</span></div>
    </div>

    <p class="export-hint">
        Cinematic concept — 音源はBPM90前後のアンビエント琴に合わせてください
    </p>

    <script>
        // =====================================================
        // CINEMATIC REELS — 紫紺コース
        // =====================================================
        // 10シーン ~40s シネマティック構成
        // Opening (3s) → Title (4.5s) → 7 dishes (3.5-4.5s each)
        // → CTA (5s)
        // =====================================================

        const SCENES = [
            {
                // 0: Opening — black + text
                image: null,
                isOpening: true,
                duration: 3000,
                kb: null,
                textPosition: 'text-center',
                lines: [
                    { class: 't-michelin', text: 'ミシュラン取得　大嵓埜のグループ店' },
                    { class: 't-restaurant', text: '禅　園' },
                    { class: 't-subtitle', text: '西梅田 ─ 心斎橋' }
                ]
            },
            {
                // 1: Title — course reveal
                image: 'https://github.com/user-attachments/assets/31eb3e11-dfa8-470e-b599-45c94e44b894',
                duration: 4500,
                kb: 'kb-slow-in',
                textPosition: 'text-center',
                lines: [
                    { class: 't-subtitle', text: '二月の特別懐石' },
                    { class: 't-course', text: '紫紺コース' },
                    { class: 't-course-en', text: 'Shikon' },
                    { class: 't-gold-rule', text: '' },
                    { class: 't-price', text: '¥7,800' }
                ]
            },
            {
                // 2: 前菜
                image: 'https://github.com/user-attachments/assets/31eb3e11-dfa8-470e-b599-45c94e44b894',
                duration: 4000,
                kb: 'kb-slow-out',
                textPosition: 'text-bottom',
                lines: [
                    { class: 't-num', text: '01' },
                    { class: 't-dish-jp', text: '前　菜' },
                    { class: 't-gold-rule', text: '' },
                    { class: 't-dish-desc', text: 'ズワイガニ湯葉和え　いなり小袖寿司\n鰯梅煮　海老金棒　お多福豆' }
                ]
            },
            {
                // 3: 造里
                image: 'https://github.com/user-attachments/assets/f73ef919-cdd6-4c50-a695-425d7ad97c69',
                duration: 3500,
                kb: 'kb-drift-right',
                textPosition: 'text-bottom',
                lines: [
                    { class: 't-num', text: '02' },
                    { class: 't-dish-jp', text: '造　里' },
                    { class: 't-gold-rule', text: '' },
                    { class: 't-dish-desc', text: '～鮮魚三種盛～\n鮪　鰤　平貝' }
                ]
            },
            {
                // 4: 焼物
                image: 'https://github.com/user-attachments/assets/c5145b6a-54e1-4ec2-b112-40e269ef40e2',
                duration: 4000,
                kb: 'kb-slow-in',
                textPosition: 'text-bottom',
                lines: [
                    { class: 't-num', text: '03' },
                    { class: 't-dish-jp', text: '焼　物' },
                    { class: 't-gold-rule', text: '' },
                    { class: 't-dish-desc', text: '鰤の葱焼　蓮根　初神' }
                ]
            },
            {
                // 5: 揚物
                image: 'https://github.com/user-attachments/assets/dd2cfccb-2fdf-4499-adfe-dfb0d4f625a6',
                duration: 4000,
                kb: 'kb-tilt',
                textPosition: 'text-bottom',
                lines: [
                    { class: 't-num', text: '04' },
                    { class: 't-dish-jp', text: '揚　物' },

                    { class: 't-dish-desc', text: '石狩煮　鮭　小芋\n牛蒡　白葱　三つ葉' }
                ]

            {
                // 7: 仕上
                image: 'https://github.com/user-attachments/assets/148e92af-7c36-4a14-9158-f53f3de600db',
                duration: 4500,
                kb: 'kb-slow-in',
                textPosition: 'text-bottom',
                lines: [
                    { class: 't-num', text: '06' },

                // 9: CTA
                image: 'https://github.com/user-attachments/assets/f73ef919-cdd6-4c50-a695-425d7ad97c69',
                duration: 5000,
                kb: 'kb-slow-in',
                isCTA: true,
                textPosition: 'text-center',
                lines: [
                    { class: 't-cta-lead', text: '接待・記念日に' },
                    { class: 't-restaurant', text: '禅　園' },
                    { class: 't-gold-rule', text: '' },
                    { class: 't-store-block', text: '西梅田店　06-6457-1002\n大阪市北区梅田2-5-25\nハービスPLAZA B2F' },
                    { class: 't-store-block', text: '心斎橋店　06-6241-7027\n大阪市中央区西心斎橋1-3-3\nホテル日航ビルB2F' }
                ]
            }
        ];

        let currentScene = -1;
        let isPlaying = false;
        let sceneTimeout = null;

        function buildScenes() {
            const wrapper = document.getElementById('scenesWrapper');
            wrapper.innerHTML = '';

            SCENES.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = 'scene';
                div.id = `scene-${i}`;

                if (s.isOpening) div.classList.add('scene-opening');
                if (s.isCTA) div.classList.add('scene-cta');

                const linesHtml = s.lines.map(l => {
                    if (l.class === 't-gold-rule') {
                        return '<div class="line t-gold-rule"></div>';
                    }
                    const text = l.text.replace(/\n/g, '<br>');
                    return `<span class="line ${l.class}">${text}</span>`;
                }).join('');

                const imgHtml = s.image
                    ? `<div class="scene-image ${s.kb || ''}" style="background-image:url('${s.image}')"></div>`
                    : '';

                div.innerHTML = `
                    ${imgHtml}
                    ${s.image ? '<div class="vignette"></div>' : ''}
                    ${s.image ? '<div class="bottom-grad"></div>' : ''}
                    ${s.isCTA ? '<div class="cta-scrim"></div>' : ''}
                    ${s.image ? '<div class="grain"></div>' : ''}
                    ${s.image && !s.isCTA ? '<div class="letterbox-top"></div><div class="letterbox-bottom"></div>' : ''}
                    ${!s.isOpening && !s.isCTA ? '<div class="gold-accent"></div>' : ''}
                    <div class="scene-text ${s.textPosition}">
                        ${linesHtml}
                    </div>
                `;
                wrapper.appendChild(div);
            });

            const total = SCENES.reduce((sum, s) => sum + s.duration, 0);
            console.log('Total duration:', Math.round(total / 1000) + 's');
        }

        function showScene(index) {
            if (index >= SCENES.length) {
                isPlaying = false;
                document.getElementById('btnPlay').innerHTML = '&#9654; 再生';
                return;
            }

            if (currentScene >= 0) {
                const prev = document.getElementById(`scene-${currentScene}`);
                if (prev) {
                    prev.classList.remove('active');
                    prev.classList.add('exiting');
                    setTimeout(() => prev.classList.remove('exiting'), 1000);
                }
            }

            currentScene = index;
            const scene = SCENES[index];

            const el = document.getElementById(`scene-${index}`);
            el.classList.remove('active');
            void el.offsetWidth;
            el.classList.add('active');

            document.getElementById('sceneIndicator').textContent =
                `${String(index + 1).padStart(2,'0')} / ${SCENES.length}`;

            sceneTimeout = setTimeout(() => {
                if (isPlaying) showScene(index + 1);
            }, scene.duration);
        }

        function startReels() {
            if (isPlaying) {
                pauseReels();
                return;
            }
            isPlaying = true;
            document.getElementById('playOverlay').classList.add('hidden');
            document.getElementById('btnPlay').innerHTML = '&#9646;&#9646; 一時停止';

            if (currentScene < 0 || currentScene >= SCENES.length - 1) {
                showScene(0);
            } else {
                showScene(currentScene);
            }
        }

        function pauseReels() {
            isPlaying = false;
            clearTimeout(sceneTimeout);
            document.getElementById('btnPlay').innerHTML = '&#9654; 再生';
        }

        function restartReels() {
            clearTimeout(sceneTimeout);
            currentScene = -1;
            isPlaying = false;
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active', 'exiting'));
            document.getElementById('playOverlay').classList.remove('hidden');
            document.getElementById('btnPlay').innerHTML = '&#9654; 再生';
            document.getElementById('sceneIndicator').textContent = '01 / ' + SCENES.length;
        }

        document.getElementById('playOverlay').addEventListener('click', startReels);
        document.getElementById('tapArea').addEventListener('click', () => {
            if (isPlaying) pauseReels();
            else startReels();
        });

        buildScenes();
    </script>
</body>
